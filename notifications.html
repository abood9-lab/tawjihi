<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <title>الإشعارات - TawjihiGuide</title>
    <link rel="stylesheet" href="./dist/output.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@400;700&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Noto Sans Arabic', sans-serif; background-color: #f8f9ff; -webkit-tap-highlight-color: transparent; }
        .notif-unread { border-right: 4px solid #00346f; background: #eff6ff; }
    </style>
</head>
<body class="bg-[#f8f9ff] text-slate-900 pb-24 lg:pb-0">

<main class="pt-24 px-4 md:px-8 pb-10">
    <div class="max-w-5xl mx-auto text-right">
        <header class="mb-6">
            <h1 class="text-3xl font-black text-slate-800">الإشعارات</h1>
            <p class="text-slate-500 font-medium">جميع تنبيهات طلبات الصداقة والرسائل تظهر هنا.</p>
        </header>

        <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
            <div class="px-5 py-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
                <button id="markAllReadBtn" class="text-primary font-bold text-sm">تعليم الكل كمقروء</button>
                <div class="text-sm text-slate-600">غير المقروء: <span id="unreadCount" class="font-black text-primary">0</span></div>
            </div>

            <div id="notificationsList" class="divide-y divide-slate-100 max-h-[70vh] overflow-y-auto">
                <div class="p-8 text-center text-slate-400">جاري تحميل الإشعارات...</div>
            </div>
        </section>
    </div>
</main>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
    import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import {
        getFirestore,
        collection,
        query,
        where,
        onSnapshot,
        doc,
        updateDoc,
        deleteDoc,
        writeBatch
    } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
    import { CONFIG } from './config.js';

    const firebaseConfig = CONFIG.FIREBASE;

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentDocs = [];

    function iconForType(type) {
        if (type === 'friend_request') return '👥';
        if (type === 'friend_request_accepted') return '✅';
        if (type === 'message') return '💬';
        if (type === 'lesson_reply') return '↩️';
        if (type === 'lesson_like') return '👍';
        if (type === 'report_update') return '🛡️';
        if (type === 'pinned_post') return '📌';
        return '🔔';
    }

    function formatDate(ts) {
        if (!ts) return '';
        const d = ts.toDate ? ts.toDate() : new Date(ts);
        return d.toLocaleString('ar');
    }

    function renderNotifications() {
        const list = document.getElementById('notificationsList');
        const unreadCount = currentDocs.filter((d) => d.data().unread).length;
        document.getElementById('unreadCount').textContent = unreadCount;

        if (!currentDocs.length) {
            list.innerHTML = '<div class="p-8 text-center text-slate-400">لا توجد إشعارات حالياً</div>';
            return;
        }

        list.innerHTML = currentDocs.map((d) => {
            const n = d.data();
            return `
                <div class="p-4 flex items-start gap-3 ${n.unread ? 'notif-unread' : ''}">
                    <button class="delete-btn text-red-500" data-id="${d.id}" title="حذف">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                    <button class="notif-btn flex-1 text-right" data-id="${d.id}" data-link="${n.link || ''}">
                        <p class="text-sm font-black text-slate-800">${iconForType(n.type)} ${n.message || 'إشعار'}</p>
                        <p class="text-xs text-slate-500 mt-1">${formatDate(n.createdAt)}</p>
                    </button>
                </div>
            `;
        }).join('');

        list.querySelectorAll('.notif-btn').forEach((btn) => {
            btn.addEventListener('click', async () => {
                const id = btn.getAttribute('data-id');
                const link = btn.getAttribute('data-link');
                await updateDoc(doc(db, 'notifications', id), { unread: false });
                if (link) window.location.href = link;
            });
        });

        list.querySelectorAll('.delete-btn').forEach((btn) => {
            btn.addEventListener('click', async () => {
                const id = btn.getAttribute('data-id');
                await deleteDoc(doc(db, 'notifications', id));
            });
        });
    }

    function listenNotifications() {
        const q = query(
            collection(db, 'notifications'),
            where('userId', '==', currentUser.uid)
        );

        onSnapshot(q, (snap) => {
            currentDocs = snap.docs.sort((a, b) => {
                const aTime = a.data().createdAt?.toMillis ? a.data().createdAt.toMillis() : 0;
                const bTime = b.data().createdAt?.toMillis ? b.data().createdAt.toMillis() : 0;
                return bTime - aTime;
            });
            renderNotifications();
        }, () => {
            document.getElementById('notificationsList').innerHTML = '<div class="p-8 text-center text-red-500">تعذر تحميل الإشعارات</div>';
        });
    }

    document.getElementById('markAllReadBtn').addEventListener('click', async () => {
        if (!currentDocs.length) return;
        const batch = writeBatch(db);
        currentDocs.forEach((d) => {
            if (d.data().unread) {
                batch.update(doc(db, 'notifications', d.id), { unread: false });
            }
        });
        await batch.commit();
    });

    onAuthStateChanged(auth, (user) => {
        if (!user) {
            window.location.href = 'signup.html';
            return;
        }
        currentUser = user;
        listenNotifications();
    });
</script>

<script src="site-shell.js" defer></script>
</body>
</html>
